<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RecoveryOps — Collections Intelligence</title>
  <meta name="description" content="Enterprise lending collections intelligence prototype.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'ui-sans-serif', 'system-ui', 'sans-serif'],
            display: ['"Space Grotesk"', 'ui-sans-serif', 'sans-serif'],
          },
          colors: {
            background: 'var(--background)',
            foreground: 'var(--foreground)',
            card: {
              DEFAULT: 'var(--card)',
              foreground: 'var(--card-foreground)',
            },
            popover: {
              DEFAULT: 'var(--popover)',
              foreground: 'var(--popover-foreground)',
            },
            primary: {
              DEFAULT: 'var(--primary)',
              foreground: 'var(--primary-foreground)',
            },
            secondary: {
              DEFAULT: 'var(--secondary)',
              foreground: 'var(--secondary-foreground)',
            },
            muted: {
              DEFAULT: 'var(--muted)',
              foreground: 'var(--muted-foreground)',
            },
            accent: {
              DEFAULT: 'var(--accent)',
              foreground: 'var(--accent-foreground)',
            },
            destructive: {
              DEFAULT: 'var(--destructive)',
              foreground: 'var(--destructive-foreground)',
            },
            border: 'var(--border)',
            input: 'var(--input)',
            ring: 'var(--ring)',
            success: 'var(--success)',
            warning: {
              DEFAULT: 'var(--warning)',
              foreground: 'var(--warning-foreground)',
            },
          },
          borderRadius: {
            sm: 'calc(var(--radius) - 4px)',
            md: 'calc(var(--radius) - 2px)',
            lg: 'var(--radius)',
            xl: 'calc(var(--radius) + 4px)',
            '2xl': '1rem',
          },
          boxShadow: {
            xs: '0 1px 2px 0 rgba(0, 0, 0, 0.05)',
            '2xs': '0 1px 1px 0 rgba(0, 0, 0, 0.03)',
          }
        }
      }
    };
  </script>
  <style>
    :root {
      --radius: 0.75rem;
      --background: oklch(0.96 0.011 255);
      --foreground: oklch(0.23 0.04 255);
      --card: oklch(1 0 0);
      --card-foreground: oklch(0.23 0.04 255);
      --popover: oklch(1 0 0);
      --popover-foreground: oklch(0.23 0.04 255);
      --primary: oklch(0.55 0.23 260);
      --primary-foreground: oklch(0.99 0 0);
      --secondary: oklch(0.94 0.018 255);
      --secondary-foreground: oklch(0.28 0.05 255);
      --muted: oklch(0.93 0.014 255);
      --muted-foreground: oklch(0.49 0.04 255);
      --accent: oklch(0.94 0.03 255);
      --accent-foreground: oklch(0.38 0.14 260);
      --destructive: oklch(0.61 0.2 25);
      --destructive-foreground: oklch(0.99 0 0);
      --border: oklch(0.88 0.022 255);
      --input: oklch(0.88 0.022 255);
      --ring: oklch(0.55 0.23 260);
      --success: oklch(0.56 0.15 150);
      --warning: oklch(0.78 0.16 75);
      --warning-foreground: oklch(0.45 0.12 60);
    }
    * {
      border-color: var(--border);
    }
    body {
      margin: 0;
      background: var(--background);
      color: var(--foreground);
      font-family: 'Inter', ui-sans-serif, system-ui, sans-serif;
    }
    button, a {
      cursor: pointer;
    }
    .text-display {
      font-family: 'Space Grotesk', ui-sans-serif, sans-serif;
    }
    .app-surface {
      background:
        radial-gradient(1000px 520px at 10% -10%, oklch(0.9 0.055 260) 0%, transparent 55%),
        radial-gradient(900px 620px at 100% 0%, oklch(0.91 0.06 175) 0%, transparent 50%),
        linear-gradient(180deg, oklch(0.97 0.01 255), oklch(0.93 0.018 255));
    }
    .glass {
      background: oklch(1 0 0 / 0.7);
      border: 1px solid oklch(1 0 0 / 0.78);
      box-shadow: 0 20px 40px -24px oklch(0.23 0.04 255 / 0.38);
      backdrop-filter: blur(20px);
    }
    .glass-strong {
      background: oklch(1 0 0 / 0.86);
      border: 1px solid oklch(1 0 0 / 0.85);
      box-shadow: 0 24px 60px -34px oklch(0.23 0.04 255 / 0.42);
      backdrop-filter: blur(24px);
    }
    @keyframes enter {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: none; }
    }
    .page-enter {
      animation: enter 0.28s ease-out both;
    }
    /* Scrollbar */
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: oklch(0.82 0.03 255); border-radius: 9999px; }
    ::-webkit-scrollbar-thumb:hover { background: oklch(0.65 0.12 260); }
  </style>
</head>

  <!-- CORE LOGIC & REACT COMPONENT TRANSLATION -->
  <script>
    // Exact raw data string from customer-nba-data.ts
    const raw = "C011,Matthew Thomas,RL-13102,201,63,47088,High,Due soon|C004,Emily Rodriguez,RL-11203,104,59,41888,High,Due soon|C009,Christopher Martinez,RL-12304,106,51,35088,High,None|C006,Sarah Anderson,AL-30552,101,43,27688,High,None|C008,Amanda Thompson,PL-21056,105,39,30488,High,Due soon|C014,Megan Harris,AL-31204,201,38,21988,High,Due soon|C001,Michael Carter,AL-10482,101,28,23588,Medium,Due soon|C007,James Wilson,RL-11782,104,26,18588,Medium,Kept before|C012,Olivia Hernandez,PL-22890,202,26,13288,Medium,None|C002,Daniel Lee,AL-10931,101,22,9800,Medium,Kept before|C003,Priya Nair,PL-20417,105,18,8400,Medium,None|C005,Robert King,RL-11990,106,14,7200,Low,Kept before|C010,Linda Gomez,AL-10655,202,11,6100,Low,None|C013,Arjun Mehta,PL-20988,104,9,4300,Low,Kept before|C015,Hannah Brooks,AL-10771,101,6,2900,Low,None|C016,Tom Reyes,RL-12011,201,3,1800,Low,None";

    const CUSTOMERS = raw.split("|").map((r, i) => {
      const parts = r.split(",");
      const id = parts[0];
      const name = parts[1];
      const acct = parts[2];
      const br = parts[3];
      const dpd = +parts[4];
      const exp = +parts[5];
      const risk = parts[6];
      const ptp = parts[7];

      const reach = Math.max(10, Math.round(70 - dpd * 0.8 + (i % 3) * 6));
      const ph = Math.max(15, Math.round(reach + 18 - (i % 4) * 3));
      const em = Math.max(8, Math.round(reach * 0.5 + (i % 5)));
      const fv = dpd >= 30 ? 85 : null;

      const ch = [
        ["Direct Phone", ph],
        ["Digital Mail", em],
      ];
      if (fv) ch.push(["Field Visit", fv]);

      const aff = ch
        .map(([n, s]) => [
          n,
          Math.round(
            s * 0.7 +
            (n === "Field Visit" ? (dpd - 30) * 0.5 : 0) +
            (n === "Direct Phone" ? 4 : 0)
          ),
        ])
        .sort((a, b) => b[1] - a[1]);

      const cov = Math.round(50 - dpd * 0.4 + (i % 4) * 8);
      const last = dpd + Math.round(dpd * 0.3);
      const pri = Math.min(
        99,
        Math.round((100 - cov) * 0.4 + (100 - reach) * 0.35 + Math.min(100, (last / 60) * 100) * 0.25)
      );
      const tier = pri >= 65 ? "High" : pri >= 45 ? "Medium" : "Low";

      const content =
        ptp === "Due soon" && dpd >= 30
          ? [
              "Settlement Offer Template",
              "Objective: Secure binding settlement with formal waiver terms",
            ]
          : dpd >= 30
            ? [
                "Broken-Commitment Re-engagement Template",
                "Objective: Escalate broken PTP & propose restructuring plan",
              ]
            : ptp === "Kept before"
              ? [
                  "Courtesy Due Reminder Template",
                  "Objective: Reinforce positive repayment track & share instant pay link",
                ]
              : [
                  "Standard Delinquency Notice Template",
                  "Objective: Present statement summary and portal resolution options",
                ];

      const cad =
        dpd >= 45
          ? ["Every 2 days", "Daily touch until borrower connects"]
          : dpd >= 30
            ? ["Every 3 days", "Twice-weekly structured follow-up"]
            : dpd >= 15
              ? ["Weekly", "Weekly review & status check"]
              : ["Every 10 days", "Bi-weekly monitoring cycle"];

      const touches = i === 15 ? 0 : Math.max(1, Math.round(dpd / 7) + (i % 5) + (dpd > 30 ? 4 : 0));
      const daysSinceOutreach = touches === 0 ? 0 : Math.max(1, Math.round((dpd % 7) + (i % 4)));
      const lastOutreachMethod = touches === 0 ? "None" : aff[0][0];

      const methodAttempts = {};
      if (touches === 0) {
        ch.forEach(([n]) => { methodAttempts[n] = { attempts: 0, success: 0 }; });
      } else {
        const phAtt = Math.max(1, Math.round(touches * 0.55));
        const emAtt = Math.max(1, Math.round(touches * 0.35));
        const fvAtt = fv ? Math.max(1, touches - phAtt - emAtt) : 0;
        methodAttempts["Direct Phone"] = { attempts: phAtt, success: Math.min(phAtt, Math.round(phAtt * 0.6)) };
        methodAttempts["Digital Mail"] = { attempts: emAtt, success: Math.min(emAtt, Math.round(emAtt * 0.4)) };
        if (fv) {
          methodAttempts["Field Visit"] = { attempts: Math.max(1, fvAtt), success: 1 };
        }
      }

      const repaymentType = cov >= 60 ? "Full Repayment" : cov >= 20 ? "Partial Repayment" : "Pending Repayment";
      const daysToRepay = Math.max(3, Math.round(dpd * 0.6 + (i % 4) * 3));

      return {
        id,
        name,
        acct,
        br,
        dpd,
        exp,
        risk,
        ptp,
        reach,
        ch,
        aff,
        pri,
        tier,
        content,
        cad,
        touches,
        daysSinceOutreach,
        lastOutreachMethod,
        methodAttempts,
        cov,
        repaymentType,
        daysToRepay,
        pays: dpd > 45 ? 0 : 1 + (i % 3),
        last,

    // 2. CUSTOMER DETAIL VIEW (Exact markup from customers.$customerId.tsx)
    function renderCustomerDetailView(container, c) {
      const bTouch = bestTouchpoint(c);
      const timelineList = customerTimelines[c.id] || [];

      const wk = [
        Math.ceil(c.touches / 3),
        Math.ceil(c.touches / 4) + 1,
        Math.floor(c.touches / 3) + 1,
        Math.max(1, c.touches - 4),
      ];
      const pw = [0, c.pays > 1 ? 1 : 0, 0, c.pays ? 1 : 0];
      const maxY = Math.max(...wk, 4);
      const xPercents = [12.5, 37.5, 62.5, 87.5];
      const pts = wk.map((v, i) => {
        const x = xPercents[i];
        const y = 82 - (v / maxY) * 60;
        return { x, y, v, paid: Boolean(pw[i]) };
      });
      const lineD = pts.map((p, i) => `${i === 0 ? "M" : "L"} ${p.x} ${p.y}`).join(" ");
      const areaD = `${lineD} L ${pts[pts.length - 1].x} 94 L ${pts[0].x} 94 Z`;

      container.innerHTML = `
        <div class="mx-auto max-w-[1280px] space-y-4">
          <!-- CUSTOMER HEADER CARD -->
          <div class="rounded-2xl border border-border/80 bg-card p-6 shadow-xs">

                  </div>
                  <div class="flex items-center gap-2 rounded-lg border border-border/80 bg-card px-3 py-1.5">
                    <span class="inline-flex items-center rounded-full bg-emerald-500/15 px-2 py-0.5 text-[11px] font-semibold text-emerald-600 dark:text-emerald-400">
                      Low Priority
                    </span>
                    <b class="text-sm font-bold text-foreground">${lo}</b>
                    <span class="text-muted-foreground text-[11px]">
                      ${Math.round((lo / customers.length) * 100)}%
                    </span>
                  </div>
                </div>
              </div>

              <!-- Play cards -->
              <div class="grid gap-3 grid-cols-1 md:grid-cols-2 lg:grid-cols-3">
                ${combo.map(([k, o], idx) => {
                  const parts = k.split(" → ");
                  const t = parts[0] || "";
                  const c = parts[1] || "";
                  const f = parts[2] || "";
                  return `
                    <div
                      class="flex items-start gap-3.5 rounded-xl border p-4 transition-all hover:-translate-y-0.5 hover:shadow-md ${
                        idx === 0
                          ? "border-[#a832c7]/60 bg-[#a832c7]/5 shadow-xs ring-1 ring-[#a832c7]/20"
                          : "border-border/80 bg-card"
                      }"
                    >
                      <div
                        class="shrink-0 min-w-[72px] rounded-xl px-2 py-3 text-center flex flex-col items-center justify-center ${
                          idx === 0
                            ? "text-white shadow-xs"
                            : "bg-fuchsia-50 dark:bg-fuchsia-950/40 text-[#7828c8] dark:text-fuchsia-300 border border-fuchsia-200/50"
                        }"
                        style="${idx === 0 ? "background: linear-gradient(135deg, #7828c8 0%, #c432b8 100%);" : ""}"
                      >
                        <b class="block text-2xl font-extrabold leading-none">${o.n}</b>
                        <span class="text-[8px] font-bold uppercase tracking-wider opacity-90 mt-1 block whitespace-nowrap">
                          Borrowers
                        </span>
                      </div>

                      <div class="flex-1 min-w-0 space-y-1.5 text-xs">
                        <div class="flex items-start gap-1.5">
                          <span class="flex size-4 shrink-0 items-center justify-center rounded bg-[#7828c8]/10 text-[9px] font-bold text-[#7828c8] mt-0.5">
                            T
                          </span>
                          <div class="flex-1 font-semibold text-foreground leading-snug">
                            ${t}
                            ${idx === 0 ? `
                              <span
                                class="ml-1.5 inline-block rounded-full px-2 py-0.2 text-[9px] font-extrabold text-white"
                                style="background: linear-gradient(90deg, #7828c8, #c432b8);"
                              >
                                TOP PLAY
                              </span>
                            ` : ""}
                          </div>
                        </div>
                        <div class="flex items-center gap-1.5 text-muted-foreground">
                          <span class="flex size-4 shrink-0 items-center justify-center rounded bg-[#7828c8]/10 text-[9px] font-bold text-[#7828c8]">
                            C
                          </span>
                          <span class="font-medium text-foreground/80">${c}</span>
                        </div>
                        <div class="flex items-center gap-1.5 text-muted-foreground">
                          <span class="flex size-4 shrink-0 items-center justify-center rounded bg-[#7828c8]/10 text-[9px] font-bold text-[#7828c8]">
                            F
                          </span>
                          <span>${f}</span>
                        </div>
                        <!-- Priority distribution tags -->
                        <div class="flex gap-1.5 pt-1 flex-wrap">
                          ${o.High > 0 ? `
                            <span class="rounded bg-destructive/10 px-1.5 py-0.5 text-[10px] font-semibold text-destructive">
                              High ${o.High}
                            </span>
                          ` : ""}
                          ${o.Medium > 0 ? `
                            <span class="rounded bg-amber-500/15 px-1.5 py-0.5 text-[10px] font-semibold text-amber-600 dark:text-amber-400">
                              Medium ${o.Medium}
                            </span>
                          ` : ""}
                          ${o.Low > 0 ? `
                            <span class="rounded bg-emerald-500/15 px-1.5 py-0.5 text-[10px] font-semibold text-emerald-600 dark:text-emerald-400">
                              Low ${o.Low}
                            </span>
                          ` : ""}
                        </div>
                      </div>
                    </div>
                  `;
                }).join("")}
              </div>
            </div>
          </div>

          <!-- 3 CORE SECTIONS ROW -->
          <div class="grid gap-4 grid-cols-1 md:grid-cols-3">
            <!-- Card 1: Suggested Templates -->
            <div class="rounded-2xl border-t-4 border-t-primary border-x border-b border-border/80 bg-card p-5 shadow-xs flex flex-col justify-between">
              <div>
                <h3 class="text-sm font-bold text-foreground">Suggested Templates</h3>
                <p class="text-xs text-muted-foreground mb-4">
                  Recommended messaging template by customer responsiveness
                </p>

                <div class="space-y-3">
                  ${TEMPLATES.map((name) => {
                    const cnt = customers.filter((c) => c.content[0] === name).length;
                    const pct = Math.round((cnt / customers.length) * 100);
                    return `
                      <div>
                        <div class="flex justify-between text-xs mb-1">
                          <span class="text-muted-foreground truncate max-w-[210px]">${name}</span>
                          <span class="font-bold text-foreground">${cnt}</span>
                        </div>
                        <div class="h-1.5 w-full rounded-full bg-muted overflow-hidden">
                          <div class="h-full rounded-full bg-primary" style="width: ${pct}%"></div>
                        </div>
                      </div>
                    `;
                  }).join("")}
                </div>
              </div>

              <div class="mt-5 border-t pt-3 space-y-1.5 text-xs">
                <div class="flex justify-between">
                  <span class="text-muted-foreground">Template open rate</span>
                  <span class="font-bold text-foreground">${avgOpen}%</span>
                </div>
                <div class="flex justify-between">
                  <span class="text-muted-foreground">Link interaction rate</span>
                  <span class="font-bold text-foreground">${avgClick}%</span>
                </div>
                <div class="flex justify-between">
                  <span class="text-muted-foreground">Customer response rate</span>
                  <span class="font-bold text-foreground">${avgReach}%</span>
                </div>
              </div>
            </div>

            <!-- Card 2: Repayment Behavior -->
            <div class="rounded-2xl border-t-4 border-t-emerald-500 border-x border-b border-border/80 bg-card p-5 shadow-xs flex flex-col justify-between">
              <div>
                <h3 class="text-sm font-bold text-foreground">Repayment Behavior</h3>
                <p class="text-xs text-muted-foreground mb-4">
                  Turnaround time & partial vs full settlement breakdown
                </p>

                <div class="space-y-3">
                  ${TIMING_CYCLES.map((name) => {
                    const cnt = customers.filter((c) => c.cad[0] === name).length;
                    const pct = Math.round((cnt / customers.length) * 100);
                    return `
                      <div>
                        <div class="flex justify-between text-xs mb-1">
                          <span class="text-muted-foreground">Follow-up: ${name}</span>
                          <span class="font-bold text-foreground">${cnt}</span>
                        </div>
                        <div class="h-1.5 w-full rounded-full bg-muted overflow-hidden">
                          <div class="h-full rounded-full bg-emerald-500" style="width: ${pct}%"></div>
                        </div>
                      </div>
                    `;
                  }).join("")}
                </div>
              </div>

              <div class="mt-5 border-t pt-3 space-y-1.5 text-xs">
                <div class="flex justify-between">
                  <span class="text-muted-foreground">Avg time taken to repay</span>
                  <span class="font-bold text-foreground">${avgDaysToRepay} days</span>
                </div>
                <div class="flex justify-between">
                  <span class="text-muted-foreground">Full repayment profile</span>
                  <span class="font-bold text-emerald-600 dark:text-emerald-400">
                    ${fullRepayCount} customers
                  </span>
                </div>
                <div class="flex justify-between">
                  <span class="text-muted-foreground">Partial repayment profile</span>
                  <span class="font-bold text-amber-600 dark:text-amber-400">
                    ${partialRepayCount} customers
                  </span>
                </div>
                <div class="flex justify-between">
                  <span class="text-muted-foreground">Repayment coverage ratio</span>
                  <span class="font-bold text-foreground">${avgCov}%</span>
                </div>
              </div>
            </div>

            <!-- Card 3: Communication Preferences -->
            <div class="rounded-2xl border-t-4 border-t-amber-500 border-x border-b border-border/80 bg-card p-5 shadow-xs flex flex-col justify-between">
              <div>
                <div class="flex justify-between items-start gap-2">
                  <div>
                    <h3 class="text-sm font-bold text-foreground">Communication Preferences</h3>
                    <p class="text-xs text-muted-foreground mb-3">
                      Post-due date touches & method success rate
                    </p>
                  </div>
                  ${zeroOutreachCount > 0 ? `
                    <span class="rounded-full bg-amber-500/15 px-2 py-0.5 text-[10px] font-semibold text-amber-600 dark:text-amber-400">
                      ${zeroOutreachCount} uncontacted
                    </span>
                  ` : ""}
                </div>

                <!-- Bar graph -->
                <div class="flex items-end gap-3 h-28 pt-2 pb-2 border-b">
                  ${touchMethods.map(({ name, success, attempts }) => `
                    <div class="flex-1 flex flex-col items-center justify-end h-full gap-1.5 text-[11px]">
                      <div class="w-full flex-1 flex items-end">
                        <div
                          class="w-full rounded-t-md bg-amber-500 transition-all duration-300"
                          style="height: ${Math.round((success / 100) * 58)}px;"
                        ></div>
                      </div>
                      <span class="text-muted-foreground truncate max-w-[80px] text-[10px]">
                        ${name}
                      </span>
                      <span class="font-bold text-foreground text-xs leading-none">
                        ${success}% <span class="text-[10px] font-normal text-muted-foreground">(${attempts})</span>
                      </span>
                    </div>
                  `).join("")}
                </div>
              </div>

              <div class="mt-3 space-y-1.5 text-xs">
                <div class="flex justify-between text-muted-foreground pb-1 border-b">
                  <span>Avg follow-ups post due-date</span>
                  <span class="font-bold text-foreground">${avgTouches} touches</span>
                </div>
                <div class="flex justify-between text-muted-foreground pb-1 border-b">
                  <span>Avg days since last outreach</span>
                  <span class="font-bold text-foreground">${avgDaysSinceOutreach} days</span>
                </div>
                <div class="flex justify-between text-muted-foreground pb-1 border-b">
                  <span>Accounts contacted after due-date</span>
                  <span class="font-bold text-foreground">
                    ${contactedCount}/${customers.length} (${Math.round((contactedCount / customers.length) * 100)}%)
                  </span>
                </div>
                ${touchMethods.map(({ name, attempts }) => `
                  <div class="flex justify-between">
                    <span class="text-muted-foreground">${name}</span>
                    <span class="font-bold text-foreground">
                      ${nb[name] || 0} top pref · <span class="text-muted-foreground font-normal">${attempts} attempts</span>
                    </span>
                  </div>
                `).join("")}
              </div>
            </div>
          </div>
        </div>
      `;
    }

    // 4. OUTCOME DRAWER LOGIC
    const DISPOSITIONS = [
      "Connected", "Promise to Pay", "No Answer", "Busy",
      "Financial Hardship", "Dispute Raised", "Wrong Number", "Refusal",
    ];

    function openOutcomeDrawer(customerId) {
      const c = CUSTOMERS.find((x) => x.id === (customerId || activeCustomerId));
      if (!c) return;
      activeCustomerId = c.id;

      document.getElementById("drawerCustomerBanner").innerHTML = `
        <span class="font-bold text-foreground">${c.name}</span> (${c.id}) •{" "}
        <span class="text-muted-foreground">
          $${c.exp.toLocaleString()} balance · ${c.dpd} DPD · ${c.repaymentType}
        </span>
      `;

      document.getElementById("drawerActionPill").innerHTML = `
        <svg class="size-3.5 text-primary" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
        <span>${bestTouchpoint(c)} with ${c.content[0]}</span>
      `;

      renderDispositionGrid();
      document.getElementById("outcomeDrawer").classList.remove("hidden");
    }

    function closeOutcomeDrawer() {
      document.getElementById("outcomeDrawer").classList.add("hidden");
    }

    function renderDispositionGrid() {
      const grid = document.getElementById("dispositionGrid");
      grid.innerHTML = DISPOSITIONS.map((disp) => `
        <button
          type="button"
          onclick="selectOutcomeDisp('${disp}')"
          class="rounded-lg border p-2 text-xs text-left transition ${
            selectedOutcome === disp
              ? "border-primary bg-primary/10 text-primary font-bold shadow-xs"
              : "bg-card hover:bg-muted text-foreground"
          }"
        >
          ${disp}
        </button>
      `).join("");

      const ptpBlock = document.getElementById("drawerPtpBlock");
      if (selectedOutcome === "Promise to Pay") {
        ptpBlock.classList.remove("hidden");
      } else {
        ptpBlock.classList.add("hidden");
      }
    }

    function selectOutcomeDisp(disp) {
      selectedOutcome = disp;
      renderDispositionGrid();
    }

    function submitOutcome() {
      const c = CUSTOMERS.find((x) => x.id === activeCustomerId);
      const ptpAmt = document.getElementById("drawerPtpAmount").value;
      const notes = document.getElementById("drawerNotes").value;

      if (!customerTimelines[activeCustomerId]) customerTimelines[activeCustomerId] = [];
      customerTimelines[activeCustomerId].unshift({
        title: `Outcome Logged: ${selectedOutcome}`,
        category: "Outreach History",
        time: "Just now",
        status: selectedOutcome === "Promise to Pay" ? `${ptpAmt} PTP` : "Logged",
        tone: "green",
      });

      closeOutcomeDrawer();
      showToast(`Outcome "${selectedOutcome}" recorded for ${c.name}`);
      renderCurrentView();
    }

    // Toast
    function showToast(message) {
      const container = document.getElementById("toastContainer");
      const toast = document.createElement("div");
      toast.className = "flex items-center gap-2 rounded-xl border border-border/80 bg-card p-3 shadow-lg text-xs font-semibold text-foreground pointer-events-auto transition-all";
      toast.innerHTML = `
        <span class="size-2 rounded-full bg-emerald-500"></span>
        <span>${message}</span>
      `;
      container.appendChild(toast);
      setTimeout(() => {
        toast.style.opacity = "0";
        setTimeout(() => toast.remove(), 300);
      }, 3500);
    }

    // INIT
    window.addEventListener("DOMContentLoaded", () => {
      renderCurrentView();
    });
  </script>
</body>
</html>
